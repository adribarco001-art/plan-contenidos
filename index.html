<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi Plan de Contenidos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Playfair+Display:wght@400;500;600&display=swap">
<style>
/* Layout: a left sidebar (top bar on phones) with the seven pages and an always-visible "Descargar mi plan" button; one working column per page. Palette from the brief: black, pink, warm light grey. Playfair Display stands in for RoxboroughCF, Hanken Grotesk for Aileron. */
:root {
  --bg: #ebe6e6;
  --surface: #f6f3f3;
  --field: #ffffff;
  --fg: #000000;
  --muted: #5a5256;
  --line: #d2cbcb;
  --line-strong: #8a8083;
  --accent: #ffa3db;
  --on-accent: #000000;
  --btn-bg: #000000;
  --btn-fg: #ebe6e6;
  --ok: #1f6b45;
  --warn: #8a5a00;
  --font-display: 'Playfair Display', 'Times New Roman', serif;
  --font-body: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #131113; --field: #0a080a; --fg: #ebe6e6; --muted: #a89fa3;
    --line: #2a2528; --line-strong: #6e6569; --accent: #ffa3db; --on-accent: #000000;
    --btn-bg: #ffa3db; --btn-fg: #000000; --ok: #86cba4; --warn: #e5b567; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #131113; --field: #0a080a; --fg: #ebe6e6; --muted: #a89fa3;
  --line: #2a2528; --line-strong: #6e6569; --accent: #ffa3db; --on-accent: #000000;
  --btn-bg: #ffa3db; --btn-fg: #000000; --ok: #86cba4; --warn: #e5b567; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* Type roles */
.h1 { font-family: var(--font-display); font-weight: 500; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(28px, 6vw, 44px); line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
.h2 { font-family: var(--font-display); font-weight: 500; font-size: 25px; line-height: 1.2; text-wrap: balance; }
.s1 { font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
.s2 { font-weight: 700; font-size: 15px; }

.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Shell */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.side-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 10px 4px; }
.brand { font-family: var(--font-display); font-size: 17px; font-weight: 500; letter-spacing: .02em; }
.who { font-size: 13px; color: var(--muted); text-align: right; min-width: 0; overflow-wrap: anywhere; }
.who b { color: var(--fg); font-weight: 700; display: block; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: 0 0 auto; text-decoration: none; padding: 9px 12px 8px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; font-size: 14.5px; white-space: nowrap; }
.nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 700; }
.side-bot { display: none; }
.fab { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 35; box-shadow: 0 6px 22px rgba(0,0,0,.28); }
.main-col { min-width: 0; }
main { max-width: 800px; margin: 0 auto; padding-block: 28px 96px; }

@media (min-width: 920px) {
  .shell { grid-template-columns: 270px minmax(0, 1fr); }
  .side { top: 0; height: 100vh; border-bottom: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  .side-top { flex-direction: column; align-items: flex-start; padding-block: 28px 14px; }
  .who { text-align: left; }
  .nav { flex-direction: column; overflow: visible; gap: 2px; }
  .nav a { border-bottom: 0; border-left: 2px solid transparent; padding: 10px 12px; font-size: 15px; white-space: normal; }
  .nav a[aria-current="page"] { border-left-color: var(--fg); background: var(--surface); }
  .side-bot { display: grid; gap: 8px; margin-top: auto; padding-block: 16px 20px; }
  .btn.fab { display: none; }
  main { padding-block: 44px 64px; }
}

/* Page heads and sections */
.lead { color: var(--muted); margin-top: 12px; max-width: 62ch; }
.eyebrow { color: var(--muted); margin-bottom: 8px; display: block; }
.sec { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-note { color: var(--muted); font-size: 14.5px; margin-top: 6px; max-width: 64ch; }
.pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 99px; padding: 1px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.fields { display: grid; gap: 22px; margin-top: 20px; }
.stack { display: grid; gap: 12px; }

/* Fields */
.field { min-width: 0; }
.field > label, .field > legend { display: block; margin-bottom: 2px; padding: 0; }
.hint { color: var(--muted); font-size: 13.5px; margin-bottom: 8px; max-width: 64ch; }
.ctl { width: 100%; background: var(--field); border: 1px solid var(--line-strong); border-radius: 6px; padding: 11px 12px; min-height: 46px; display: block; }
.ctl::placeholder { color: var(--muted); opacity: .85; }
textarea.ctl { resize: vertical; min-height: 92px; line-height: 1.5; overflow: hidden; }
textarea.ctl.short { min-height: 64px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; max-width: 100%; }
.chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chip span { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: 99px; font-size: 14.5px; background: var(--field); overflow-wrap: anywhere; }
.chip input:checked + span { background: var(--accent); color: var(--on-accent); border-color: var(--fg); font-weight: 700; }
.chip input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }
.checklist { display: grid; gap: 8px; }
.checklist .chip span { border-radius: 8px; width: 100%; }

.rowbox { border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--surface); min-width: 0; }
.rowbox + .rowbox { margin-top: 12px; }
.rowbox-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; min-height: 38px; }
.rowbox-h .s1 { color: var(--muted); }
.rowgrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.rowgrid .field > label { font-size: 14px; }
.freqs { display: grid; gap: 10px; margin-top: 12px; }
.freqrow { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.freqrow .pn { min-width: 86px; font-weight: 700; font-size: 14px; }
.freqrow .ctl { width: 84px; }
.freqrow select.ctl { width: auto; min-width: 150px; }
.freqrow .tx { color: var(--muted); font-size: 14px; }
.total { margin-top: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.total.ok { color: var(--ok); }
.total.warn { color: var(--warn); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 6px; border: 1px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); cursor: pointer; font-weight: 700; font-size: 15px; text-align: center; text-decoration: none; }
.btn.ghost { background: none; color: var(--fg); border-color: var(--line-strong); }
.btn.pink { background: var(--accent); color: var(--on-accent); border-color: var(--fg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 38px; padding: 6px 14px; font-size: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; flex-wrap: wrap; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.filebtn:focus-within { outline: 2px solid var(--fg); outline-offset: 2px; }

/* Images, previews */
.ref-tag { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 20px; overflow-wrap: anywhere; }
.ref-img { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.ref-img img { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line-strong); display: block; }
.ccard { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; min-width: 0; }
.cgrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 20px; }
.cthumb { position: relative; aspect-ratio: 4 / 5; max-height: 340px; width: 100%; background: var(--field); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--line); overflow: hidden; }
.cthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; left: 10px; top: 10px; background: var(--accent); color: var(--on-accent); border: 1px solid var(--fg); border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
.badge:empty { display: none; }
.cinfo { padding: 12px 14px 0; display: grid; gap: 2px; min-width: 0; }
.cinfo .s1 { color: var(--muted); }
.cinfo a, .cinfo .none { font-size: 14px; overflow-wrap: anywhere; }
.cinfo .none { color: var(--muted); }
.cbody { padding: 14px; display: grid; gap: 14px; }

/* Ideas, planner */
.empty { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 20px; color: var(--muted); display: grid; gap: 12px; justify-items: start; }
.detail { margin-top: 24px; display: grid; gap: 26px; }
.detail-head { display: grid; gap: 4px; }
.detail-head p { color: var(--muted); font-size: 14px; }
details.route { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.route summary { cursor: pointer; padding: 12px 14px; font-weight: 700; min-height: 46px; display: flex; align-items: center; }
details.route .rt { padding: 0 14px 14px; display: grid; gap: 10px; font-size: 14px; }
details.route .rt b { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
details.route .rt span { white-space: pre-wrap; overflow-wrap: anywhere; }
.scene .rowgrid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.ai-msg { font-size: 14px; color: var(--muted); min-height: 22px; margin-top: 10px; }
.check1 { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
.check1 input { width: 18px; height: 18px; accent-color: var(--fg); }

/* KPI, meters */
.kpi-name { overflow-wrap: anywhere; }
.kpi-calc { margin-top: 12px; display: grid; gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums; }
.meter { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--fg); width: 0; transition: width .3s ease; }
.meter.done i { background: var(--ok); }
.meter.pink i { background: var(--accent); box-shadow: inset 0 0 0 1px var(--fg); }
.kpi-calc .row { display: flex; gap: 8px 18px; flex-wrap: wrap; color: var(--muted); }
.kpi-calc .row strong { color: var(--fg); }

/* Dashboard */
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); margin-top: 24px; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; display: grid; gap: 8px; align-content: start; text-decoration: none; min-width: 0; }
.card:hover { border-color: var(--fg); }
.card .big { font-family: var(--font-display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.card .sub { color: var(--muted); font-size: 13.5px; }
.next { margin-top: 24px; border: 1px solid var(--fg); background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 16px; display: flex; gap: 12px 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.next p { max-width: 52ch; }
.next .btn { background: #000; color: #ebe6e6; border-color: #000; }
.bars { display: grid; gap: 14px; margin-top: 18px; }
.bar-row { display: grid; gap: 6px; }
.bar-row .top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.bar-row .top span:first-child { font-weight: 700; overflow-wrap: anywhere; }
.bar-row .top span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
.chartbox { margin-top: 18px; width: 100%; overflow-x: auto; }
.chartbox svg { display: block; }
.gl { stroke: var(--line); stroke-width: 1; }
.g100 { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 4 4; }
.ln { stroke: var(--fg); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.pt { fill: var(--accent); stroke: var(--fg); stroke-width: 2; }
.gt { fill: var(--muted); font-size: 11.5px; font-family: var(--font-body); }
.pv { fill: var(--fg); font-size: 12px; font-weight: 700; font-family: var(--font-body); }
.tablewrap { overflow-x: auto; margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }

/* Informes selector */
.months { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.newmonth { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 16px; }
.newmonth .field { flex: 1 1 200px; }

/* Perfil */
.palettes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.pal { position: relative; }
.pal input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.pal > span { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; min-height: 52px; font-size: 14px; background: var(--field); }
.pal input:checked + span { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); font-weight: 700; }
.pal input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }
.sw { display: inline-flex; flex: 0 0 auto; width: 34px; height: 34px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line-strong); }
.sw i { flex: 1; }
.custom { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; }
.custom label { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.custom input[type="color"] { width: 52px; height: 40px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--field); cursor: pointer; }
.studio { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; margin-top: 18px; }
.cover { width: 190px; max-width: 100%; aspect-ratio: 3 / 4; border-radius: 4px; padding: 18px 16px; display: flex; flex-direction: column; justify-content: center; gap: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.3); border: 1px solid var(--line); overflow: hidden; }
.cover .k { font-family: var(--font-display); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; }
.cover .bar2 { width: 26px; height: 2px; }
.cover .n { font-family: var(--font-display); font-size: 24px; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; }
.cover .f { font-size: 9px; letter-spacing: .12em; margin-top: 14px; opacity: .9; overflow-wrap: anywhere; }
.studio-side { flex: 1 1 260px; min-width: 0; }

/* Downloads */
.dl { display: grid; gap: 12px; margin-top: 18px; }
.dl-item { display: flex; gap: 14px; justify-content: space-between; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--surface); }
.dl-item > div { min-width: 0; flex: 1 1 240px; }
.dl-item p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.banner { margin-top: 20px; margin-bottom: 28px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 12px 14px; font-size: 14px; background: var(--surface); }
.banner b { font-weight: 700; }
.danger { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--btn-bg); color: var(--btn-fg); padding: 10px 16px; border-radius: 6px; font-size: 14px; max-width: min(92vw, 460px); box-shadow: 0 6px 22px rgba(0,0,0,.3); }
.loading { padding: 40px 0; color: var(--muted); }
@media (min-width: 920px) { .toast { bottom: 24px; } }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
.authbox { max-width: 460px; margin: 48px auto 0; }
.authbox .fields { margin-top: 24px; }
body.auth .side, body.auth .btn.fab { display: none; }
body.auth .shell { grid-template-columns: minmax(0, 1fr); }
</style>
</head>

        history.replaceState(null, '', location.pathname); return SBC.auth.getSession().then(function (s) { if (s.data && s.data.session) return enter(s.data.session.user); showLogin(); });
      }).catch(function (e) { authMsg(authErr(e)); });
    });
  }
  function creds() { return { em: ($('#auth-email').value || '').trim(), pw: $('#auth-pass').value || '' }; }
  function signIn() {
    var c = creds(); if (!c.em || !c.pw) { authMsg('Escribe tu correo y tu contraseña.'); return; } authMsg('Entrando...');
    SBC.auth.signInWithPassword({ email: c.em, password: c.pw }).then(function (r) { if (r.error) { authMsg(authErr(r.error)); return; } return enter(r.data.user); }).catch(function (e) { authMsg(authErr(e)); });
  }
  function signUp() {
    var c = creds(); if (!c.em || c.pw.length < 8) { authMsg('Escribe tu correo y una contraseña de mínimo 8 caracteres.'); return; } authMsg('Creando tu cuenta...');
    SBC.auth.signUp({ email: c.em, password: c.pw, options: { emailRedirectTo: location.origin + location.pathname } }).then(function (r) {
      if (r.error) { authMsg(authErr(r.error)); return; }
      if (r.data && r.data.session) return enter(r.data.user);
      authMsg('Te enviamos un correo para confirmar tu cuenta. Ábrelo, confirma y vuelve aquí para entrar.');
    }).catch(function (e) { authMsg(authErr(e)); });
  }
  function resetPass() {
    var em = ($('#auth-email').value || '').trim(); if (!em) { authMsg('Escribe tu correo arriba y pulsa de nuevo.'); return; }
    SBC.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname }).then(function (r) { authMsg(r.error ? authErr(r.error) : 'Si ese correo tiene cuenta, te enviamos un enlace para crear una contraseña nueva.'); }).catch(function (e) { authMsg(authErr(e)); });
  }
  function enter(user) {
    UID = user.id; EMAIL = user.email || ''; DB = sbDB(SBC, UID); KEY = 'pc-plan-v3-' + UID;
    document.body.classList.remove('auth'); var ls = $('#logout-side'); if (ls) ls.hidden = false;
    $('#app').innerHTML = '<p class="loading">Cargando tu plan...</p>'; setStatus('Cargando...');
    return loadCloud().then(function () { MODE = 'cloud'; }).catch(function () { NOTE = 'No pude cargar los datos de tu cuenta. Trabajas en este dispositivo hasta que vuelva la conexión; recarga la página para intentarlo de nuevo.'; MODE = 'local'; loadLocal(); }).then(function () {
      LOADED = true; setStatus(okText()); var h = location.hash.slice(1); PAGE = BUILD[h] ? h : 'inicio'; renderPage(false);
    });
  }
  function logout() {
    clearTimeout(saveTimer); flush();
    var n = 0; (function w() { if (saving && n++ < 25) { setTimeout(w, 250); return; } SBC.auth.signOut().then(function () { location.reload(); }, function () { location.reload(); }); })();
  }
  function bootSupabase() {
    var rec = /type=recovery/.test(location.hash);
    SBC = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    DL = STANDALONE_DL; renderNav(); setStatus('');
    document.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('[data-auth]'); if (!b) return; var a = b.dataset.auth;
      if (a === 'signup') signUp(); else if (a === 'reset') resetPass(); else if (a === 'logout') logout();
    });
    if (rec) { showRecovery(); return; }
    SBC.auth.getSession().then(function (r) { var s = r.data && r.data.session; if (s) return enter(s.user); showLogin(); }).catch(function () { showLogin(); });
  }

  /* ---------- Inicio ---------- */
  function boot() {
    if (SB_ON) { bootSupabase(); return; }
    renderNav(); setStatus('Cargando...');
    var cl = window.claude, ready = Promise.resolve();
    if (cl && cl.use) {
      ready = Promise.all([cl.use('db'), cl.use('user'), cl.use('downloads'), cl.use('sample')]).then(function (r) {
        DL = r[2] || null; SAMPLE = (r[3] && typeof r[3].json === 'function') ? r[3] : null;
        if (r[0] && r[1]) return r[1].id().then(function (id) { if (id) { DB = r[0]; UID = id; } });
      }).catch(function () {});
    }
    ready.then(function () {
      if (!DL) DL = STANDALONE_DL;
      if (DB && UID) { return loadCloud().then(function () { MODE = 'cloud'; }).catch(function () { NOTE = 'No pude conectar con tu cuenta para cargar tus datos, así que trabajas en este dispositivo.'; MODE = 'local'; loadLocal(); }); }
      MODE = 'local'; loadLocal();
    }).then(function () {
      LOADED = true; setStatus(okText()); var h = location.hash.slice(1); PAGE = BUILD[h] ? h : 'inicio'; renderPage(false);
    });
  }
  boot();
})();
</script>
